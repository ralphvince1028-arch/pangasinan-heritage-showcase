<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="pb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="pb-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="pb-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="60%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" fill="url(#pb-sky)"/>
  <circle cx="980" cy="200" r="60" fill="#FFFBEB" opacity="0.9"/>
  <!-- Sea -->
  <polygon points="0,350 1200,320 1200,500 0,550" fill="url(#pb-sea)"/>
  <!-- Gentle White Surf Wave -->
  <path d="M 0,530 Q 300,500 600,520 Q 900,490 1200,500 L 1200,525 Q 900,515 600,545 Q 300,525 0,555 Z" fill="#FFFFFF" opacity="0.8"/>
  <!-- Golden Sand Coast -->
  <polygon points="0,540 1200,510 1200,675 0,675" fill="url(#pb-sand)"/>

  <!-- Left Coconut Palm Grove -->
  <g stroke="#78350F" stroke-width="14">
    <path d="M 120,675 Q 160,480 260,350" fill="none"/>
    <path d="M 60,675 Q 100,500 180,400" fill="none"/>
  </g>
  <!-- Palm Fronds -->
  <ellipse cx="270" cy="340" rx="90" ry="25" fill="#15803D" transform="rotate(-30 270 340)"/>
  <ellipse cx="280" cy="360" rx="90" ry="25" fill="#166534" transform="rotate(20 280 360)"/>
  <ellipse cx="240" cy="330" rx="80" ry="22" fill="#15803D" transform="rotate(-70 240 330)"/>
  <ellipse cx="190" cy="390" rx="75" ry="20" fill="#166534" transform="rotate(-15 190 390)"/>
</svg>

