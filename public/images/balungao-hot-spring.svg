<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="70%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="bg-mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="60%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="bg-pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1200" height="380" fill="url(#bg-sky)"/>
  
  <!-- Mount Balungao Volcano Peak -->
  <path d="M 150,380 L 520,130 C 580,90 640,90 700,130 L 1080,380 Z" fill="url(#bg-mt)"/>
  <path d="M 520,130 C 580,90 640,90 700,130 L 670,380 L 550,380 Z" fill="#14532D" opacity="0.4"/>
  
  <!-- Tropical Forest Foothills -->
  <path d="M 0,340 C 200,310 400,350 600,320 C 800,290 1000,340 1200,310 L 1200,675 L 0,675 Z" fill="#166534"/>
  <path d="M 0,400 C 250,380 500,410 750,375 C 950,350 1100,390 1200,370 L 1200,675 L 0,675 Z" fill="#15803D"/>

  <!-- Tiered Hot Spring Mineral Pools -->
  <!-- Top Pool -->
  <path d="M 320,440 C 450,420 750,420 880,440 C 920,460 900,490 850,500 C 720,515 480,515 350,500 C 300,490 290,460 320,440 Z" fill="#78350F"/>
  <path d="M 340,445 C 460,430 740,430 860,445 C 890,460 880,480 830,490 C 710,505 490,505 370,490 C 320,480 320,460 340,445 Z" fill="url(#bg-pool)"/>
  
  <!-- Thermal Steam Wisps -->
  <path d="M 450,430 Q 430,390 460,360 Q 490,330 460,300" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 600,420 Q 620,380 590,340 Q 570,300 610,270" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 750,435 Q 730,395 760,365 Q 790,335 770,305" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Lower Main Lagoon Pool -->
  <path d="M 120,530 C 350,500 850,500 1080,530 C 1140,560 1100,620 1000,640 C 800,665 400,665 200,640 C 100,620 70,560 120,530 Z" fill="#5C2E0B"/>
  <path d="M 160,540 C 380,515 820,515 1040,540 C 1090,565 1060,610 970,625 C 780,650 420,650 230,625 C 150,610 120,565 160,540 Z" fill="url(#bg-pool)"/>
  <ellipse cx="600" cy="580" rx="360" ry="40" fill="#38BDF8" opacity="0.3"/>

  <!-- Palm & Forest Accents -->
  <circle cx="80" cy="460" r="70" fill="#14532D"/>
  <circle cx="1120" cy="470" r="75" fill="#14532D"/>
</svg>

