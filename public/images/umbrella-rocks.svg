<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="ur-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="ur-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ur-rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78716C"/>
      <stop offset="50%" stop-color="#57534E"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#ur-sky)"/>
  <circle cx="250" cy="280" r="70" fill="#FEF08A" opacity="0.8"/>
  <rect y="400" width="1200" height="275" fill="url(#ur-sea)"/>
  <polygon points="0,520 1200,480 1200,675 0,675" fill="#44403C"/>

  <!-- Left Umbrella Rock -->
  <g>
    <!-- Umbrella Top Cap -->
    <ellipse cx="320" cy="380" rx="140" ry="60" fill="url(#ur-rock)"/>
    <ellipse cx="320" cy="360" rx="110" ry="40" fill="#15803D" opacity="0.8"/>
    <!-- Stem / Narrow Base -->
    <path d="M 280,390 L 295,490 L 345,490 L 360,390 Z" fill="#292524"/>
  </g>

  <!-- Center Main Giant Umbrella Rock -->
  <g>
    <ellipse cx="680" cy="340" rx="220" ry="85" fill="url(#ur-rock)"/>
    <ellipse cx="680" cy="310" rx="180" ry="55" fill="#15803D" opacity="0.8"/>
    <path d="M 620,360 L 640,510 L 720,510 L 740,360 Z" fill="#1C1917"/>
    <!-- Wave Splash Base -->
    <ellipse cx="680" cy="510" rx="90" ry="12" fill="#BAE6FD" opacity="0.6"/>
  </g>

  <!-- Right Small Rock -->
  <g>
    <ellipse cx="1020" cy="400" rx="100" ry="45" fill="url(#ur-rock)"/>
    <path d="M 990,410 L 1000,490 L 1040,490 L 1050,410 Z" fill="#292524"/>
  </g>
</svg>

