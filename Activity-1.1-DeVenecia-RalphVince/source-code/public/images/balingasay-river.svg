<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="br-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="br-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#155E75"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="350" fill="url(#br-sky)"/>
  
  <!-- Mangrove Trees on Both Banks -->
  <!-- Left Bank Canopy -->
  <path d="M 0,180 C 150,150 250,220 380,260 C 450,280 480,380 400,450 C 320,520 200,550 0,550 Z" fill="#14532D"/>
  <circle cx="180" cy="240" r="110" fill="#15803D"/>
  <circle cx="280" cy="300" r="90" fill="#166534"/>

  <!-- Right Bank Canopy -->
  <path d="M 1200,180 C 1050,150 950,220 820,260 C 750,280 720,380 800,450 C 880,520 1000,550 1200,550 Z" fill="#14532D"/>
  <circle cx="1020" cy="240" r="110" fill="#15803D"/>
  <circle cx="920" cy="300" r="90" fill="#166534"/>

  <!-- Serene River Path in Center -->
  <polygon points="560,260 640,260 950,675 250,675" fill="url(#br-water)"/>

  <!-- Water Reflections and Ripples -->
  <ellipse cx="600" cy="400" rx="140" ry="12" fill="#38BDF8" opacity="0.3"/>
  <ellipse cx="580" cy="500" rx="200" ry="16" fill="#38BDF8" opacity="0.3"/>
  <ellipse cx="620" cy="600" rx="280" ry="20" fill="#38BDF8" opacity="0.3"/>

  <!-- Eco-tour Bamboo Raft -->
  <polygon points="550,460 650,460 630,480 570,480" fill="#D97706"/>
  <circle cx="600" cy="450" r="8" fill="#1E293B"/>
  <line x1="590" y1="455" x2="615" y2="475" stroke="#78350F" stroke-width="3"/>
</svg>

