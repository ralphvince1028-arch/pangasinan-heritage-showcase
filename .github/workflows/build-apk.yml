name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          cd mobile
          npm install

      - name: Prebuild Android native project
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install

      - name: Build Android Release APK (Standalone Offline)
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy and rename APK
        run: |
          mkdir -p output
          find mobile/android/app/build/outputs/apk/release -name "*.apk" -exec cp {} output/pangasinan-heritage.apk \;
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pangasinan-heritage-apk
          path: output/pangasinan-heritage.apk
          if-no-files-found: error

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "Pangasinan Heritage Mobile APK (Direct Download)"
          body: |
            ### ?? Standalone Pangasinan Heritage Android APK
            
            This is a standalone offline release build of the Pangasinan Heritage mobile companion app.
            
            **Direct Download:**
            ?? Click **`pangasinan-heritage.apk`** below to download directly to your Android device.
            
            **Installation Instructions:**
            1. Download `pangasinan-heritage.apk` on your Android phone.
            2. Tap the downloaded file in your browser or Notifications.
            3. Tap **Install** (allow "Install unknown apps" if prompted).
            4. Launch and enjoy exploring Pangasinan!
          files: output/pangasinan-heritage.apk
          prerelease: false
          make_latest: true